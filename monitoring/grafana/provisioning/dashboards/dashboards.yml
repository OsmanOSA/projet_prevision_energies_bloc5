# Provider de dashboards : Grafana charge tous les JSON du dossier monté.
apiVersion: 1

providers:
  - name: EnergIA
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
