name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q pipeline_prevision scripts streamlit_app app.py main.py

      - name: Lint critical errors
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Validate Docker Compose
        run: docker compose config -q
